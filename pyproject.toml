[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "software-resilience-poc"
version = "0.2.0"
description = "Evidence Collector and Validator MVP for the Software Resilience Stack"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "jsonschema==4.26.0",
  "cryptography==46.0.4",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["resilience_poc*"]

[tool.setuptools.package-data]
resilience_poc = ["resources/schemas/*.json", "resources/fixtures/experiments/*/*.json"]
